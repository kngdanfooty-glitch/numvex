# /etc/nginx/sites-available/numvexs  (then: ln -s to sites-enabled, nginx -t, systemctl reload nginx)
# Replace example.com with the real domain. Certbot adds the HTTPS part for you.
server {
    listen 80;
    server_name example.com www.example.com;

    client_max_body_size 1m;

    # The API: everything under /api goes to the API program.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        # Overwrite (not append) so nobody can fake their IP; our rate limits depend on this being the real address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check (for uptime monitors).
    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
    }

    # Everything else is the website.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Render Blueprint for the NumVex WEBSITE (the Next.js app in apps/web).
#
# Describes BOTH services: the API (numvexs-api) and the website (numvexs-web). Secret values are never stored here:
# every `sync: false` variable is asked for in the Render dashboard when the blueprint is applied.
# Step-by-step instructions, and what to change on the API, are in deploy/RENDER.md.
#
# Nothing here switches the live site over: it only creates a new service. The live site stays on Vercel until the domain is moved.
services:
  - type: web
    name: numvexs-api
    runtime: node
    plan: free # sleeps after 15 idle minutes (the website waits for it to wake); switch to starter (about $7/month) for always-on
    region: frankfurt
    branch: main
    buildCommand: npm ci --include=dev && npm run build -w @numvexs/api
    startCommand: npm run start -w @numvexs/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      # Render's edge + the website service in front of the API; see deploy/RENDER.md before changing.
      - key: TRUST_PROXY
        value: "2"
      # The website's public address (allowed to call this API with cookies), e.g. https://numvexs-web.onrender.com
      - key: WEB_ORIGIN
        sync: false
      # MongoDB connection string (e.g. from MongoDB Atlas). Render has no managed MongoDB.
      - key: MONGODB_URI
        sync: false
      # Email is left off for now (no SMTP_HOST): sign-up codes are printed in the service logs instead of emailed.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: POCKETFI_API_TOKEN
        sync: false
      - key: POCKETFI_BUSINESS_ID
        sync: false
      - key: POCKETFI_WEBHOOK_SECRET
        sync: false
      # Provider keys: leave a value empty and that server shows "not set up yet".
      - key: DAISYSMS_API_KEY
        sync: false
      - key: SMSPOOL_API_KEY
        sync: false
      - key: FIVESIM_API_KEY
        sync: false
      - key: JUICYSMS_API_KEY
        sync: false
      - key: GRAMSUBS_SECRET_KEY
        sync: false
      - key: TEXTVERIFIED_API_KEY
        sync: false
      - key: TEXTVERIFIED_USERNAME
        sync: false
      - key: HEROSMS_API_KEY
        sync: false
      - key: SMSBOWER_API_KEY
        sync: false
      - key: MANESMS_API_KEY
        sync: false
      - key: MORETHANPANEL_API_KEY
        sync: false
      - key: PEAKERR_API_KEY
        sync: false
      - key: RESELLERSMM_API_KEY
        sync: false
  - type: web
    name: numvexs-web
    runtime: node
    plan: free # sleeps after 15 idle minutes; switch to starter (about $7/month) for always-on
    region: frankfurt # the SAME region as numvexs-api, so the two talk quickly
    branch: main
    # Installs the whole workspace (the website uses packages/shared), then builds only the website.
    buildCommand: npm ci --include=dev && npm run build -w @numvexs/web
    startCommand: cd apps/web && npx next start --port $PORT
    healthCheckPath: /login
    autoDeploy: true # every push to main redeploys, whoever wrote the commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The start command binds to $PORT (the web start script hardcodes 3300, so it is bypassed).
      - key: PORT
        value: "3000"
      # Where /api/* calls are forwarded. Read at BUILD time, so changing it needs a new deploy.
      # Set it to the API's public address, e.g. https://numvexs-api.onrender.com (no trailing slash).
      - key: API_PROXY_TARGET
        sync: false
